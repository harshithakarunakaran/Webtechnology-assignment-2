<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="form-card">
      <header>
        <p class="eyebrow">STUDENT ADMISSION PORTAL</p>
        <h1>Student Registration</h1>
        <p class="subtitle">Enter your details to register for a course.</p>
      </header>

      <form id="registrationForm" novalidate>
        <div class="form-group">
          <label for="name">Full name <span>*</span></label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
          <small class="error" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="rollNumber">Roll number <span>*</span></label>
          <input type="text" id="rollNumber" name="rollNumber" placeholder="e.g. 23CS001" required>
          <small class="error" id="rollNumberError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email address <span>*</span></label>
          <input type="email" id="email" name="email" placeholder="student@example.com" required>
          <small class="error" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="course">Course <span>*</span></label>
          <select id="course" name="course" required>
            <option value="">Select a course</option>
            <option value="Computer Science and Engineering">Computer Science and Engineering</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics and Communication Engineering">Electronics and Communication Engineering</option>
            <option value="Electrical and Electronics Engineering">Electrical and Electronics Engineering</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
          </select>
          <small class="error" id="courseError"></small>
        </div>

        <div class="form-group">
          <label for="password">Create password <span>*</span></label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" required>
          <small class="hint">Use 8+ characters with uppercase, lowercase, a number and a symbol.</small>
          <small class="error" id="passwordError"></small>
        </div>

        <div class="form-group">
          <label for="document">Upload profile/document</label>
          <input type="file" id="document" name="document" accept=".jpg,.jpeg,.png,.pdf">
          <small class="hint">Allowed: JPG, PNG or PDF. Maximum size: 2 MB.</small>
          <small class="error" id="documentError"></small>
        </div>

        <button type="submit">Register Student</button>
        <p id="formMessage" class="message" role="status" aria-live="polite"></p>
      </form>
      <footer>* Required fields</footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
